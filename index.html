<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="区間タイマー">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>区間タイマー</title>
</head>
<body>
<div id="app">
<header>
  <div><h1>区間タイマー</h1><p>ストレッチや運動用の個人タイマー</p></div>
  <button id="installBtn" class="ghost" hidden>インストール</button>
</header>

<main>
<section id="groupsView" class="view">
  <div class="section-head"><h2>タイムグループ</h2><button id="newGroupBtn" class="primary">＋ 新規作成</button></div>
  <div id="groupList" class="cards"></div>
</section>

<section id="editView" class="view" hidden>
  <div class="section-head"><button class="ghost backBtn">← 戻る</button><h2 id="editTitle">グループ編集</h2></div>
  <label>グループ名<input id="groupName" maxlength="30" autocomplete="off"></label>
  <label>全体の繰り返し回数
    <select id="repeatCount"><option>1</option><option>2</option><option>3</option><option>5</option><option>10</option></select>
  </label>
  <div class="section-head"><h3>区間</h3><button id="addStepBtn" class="secondary">＋ 区間追加</button></div>
  <div id="stepList"></div>
  <div class="actions"><button id="saveGroupBtn" class="primary">保存</button><button id="deleteGroupBtn" class="danger">削除</button></div>
</section>

<section id="timerView" class="view" hidden>
  <div class="section-head"><button class="ghost backBtn">← 戻る</button><h2 id="timerGroupName"></h2></div>
  <div class="timer-card">
    <div id="phaseLabel">準備完了</div>
    <div id="timerText">00:30</div>
    <div id="stepInfo">区間 1 / 1</div>
    <div class="progress"><div id="progressBar"></div></div>
    <div id="nextInfo">次：なし</div>
  </div>
  <div class="timer-actions">
    <button id="startPauseBtn" class="primary large">開始</button>
    <button id="prevBtn" class="secondary">前へ</button>
    <button id="nextBtn" class="secondary">次へ</button>
    <button id="resetBtn" class="secondary">リセット</button>
  </div>
  <label class="switch-row"><input type="checkbox" id="keepAwake" checked> 画面の消灯を防ぐ（対応端末のみ）</label>
  <p id="notice" class="notice" aria-live="polite"></p>
</section>
</main>
<footer>設定はこの端末内だけに保存されます。</footer>
</div>
<script src="app.js"></script>
</body>
</html>
